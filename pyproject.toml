[project]
name = "local-ocr"
version = "0.1.0"
description = "Free, offline-capable local OCR workbench with pluggable language and engine support"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24,<2", "Pillow>=10,<13"]
tesseract = ["pytesseract>=0.3.13,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
export = ["python-docx>=1.1,<2"]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
local-ocr = "local_ocr.cli:app"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
