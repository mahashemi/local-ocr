name: Deploy Persian Trainer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
      - "tools/audit-term03.cjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Term 01 source-based vocabulary
        run: |
          node --check website/term01-data.js
          node --check website/term01-chapters-11-15.js
          node --check website/term01-chapters-16-20.js
          node --check website/term01-supplementary.js
          node <<'NODE'
          global.window = {};
          require('./website/term01-data.js');
          require('./website/term01-chapters-11-15.js');
          require('./website/term01-chapters-16-20.js');
          require('./website/term01-supplementary.js');
          const rows = window.TERM1_DATA;
          if (!Array.isArray(rows) || rows.length < 20) throw new Error('Term 01 vocabulary is unexpectedly small');
          const seen = new Set();
          for (const row of rows) {
            for (const field of ['unit', 'source', 'fa', 'tr', 'en']) {
              if (!row[field]) throw new Error('Missing ' + field + ' in ' + JSON.stringify(row));
            }
            if (/[\u0600-\u06ff]/.test(row.tr)) throw new Error('Non-Latin character in transliteration: ' + row.fa);
            const key = row.unit + '|' + row.fa;
            if (seen.has(key)) throw new Error('Duplicate Term 01 entry: ' + key);
            seen.add(key);
          }
          console.log('Validated ' + rows.length + ' Term 01 entries.');
          NODE

      - name: Validate Term 03 data JavaScript
        run: node --check website/term03-data.js

      - name: Validate Term 03 writing curriculum JavaScript
        run: node --check website/term03-writing.js

      - name: Validate Term 03 Khulasa summaries JavaScript
        run: node --check website/term03-khulasa.js

      - name: Validate expanded Term 03 lexicon JavaScript
        run: node --check website/term03-lexicon-additions.js

      - name: Validate source-audited vocabulary additions
        run: node --check website/term03-source-audit.js

      - name: Validate cross-term verb treasury
        run: node --check website/verb-treasury.js

      - name: Validate trilingual semantic vocabulary
        run: node --check website/semantic-meanings.js

      - name: Validate portal navigation JavaScript
        run: node --check website/term-portal.js

      - name: Validate body-text verb additions
        run: node --check website/term03-matn-verbs.js

      - name: Audit Term 03 vocabulary completeness and grammar fields
        run: node tools/audit-term03.cjs

      - name: Validate embedded application JavaScript
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('website/index.html','utf8'); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!match) throw new Error('Inline application script not found'); fs.writeFileSync('/tmp/persian-trainer.js',match[1]);"
          node --check /tmp/persian-trainer.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
