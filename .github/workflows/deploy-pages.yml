name: Deploy Persian Trainer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
      - "tools/**"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "study-materials/dars/term-03/**"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
      - "tools/**"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "study-materials/dars/term-03/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a deployment already in progress. Keep concurrency scoped to
# each ref so pull-request validation cannot interrupt the main deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate learning website and source data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Term 01 source-based vocabulary
        run: |
          node --check website/term01-data.js
          node --check website/term01-chapters-11-15.js
          node --check website/term01-chapters-16-20.js
          node --check website/term01-supplementary.js
          node --check website/term01-amr-verbs.js
          node --check website/term01-semantic-additions.js
          node --check website/term01-core-semantics.js
          node <<'NODE'
          global.window = {};
          require('./website/term01-data.js');
          require('./website/term01-chapters-11-15.js');
          require('./website/term01-chapters-16-20.js');
          require('./website/term01-supplementary.js');
          require('./website/term01-amr-verbs.js');
          require('./website/semantic-meanings.js');
          require('./website/term01-semantic-additions.js');
          require('./website/term01-core-semantics.js');
          const rows = window.TERM1_DATA;
          if (!Array.isArray(rows) || rows.length < 20) throw new Error('Term 01 vocabulary is unexpectedly small');
          const seen = new Set();
          for (const row of rows) {
            for (const field of ['unit', 'source', 'fa', 'tr', 'en']) {
              if (!row[field]) throw new Error('Missing ' + field + ' in ' + JSON.stringify(row));
            }
            if (/[\u0600-\u06ff]/.test(row.tr)) throw new Error('Non-Latin character in transliteration: ' + row.fa);
            const key = row.unit + '|' + row.fa;
            if (seen.has(key)) throw new Error('Duplicate Term 01 entry: ' + key);
            seen.add(key);
          }
          const amr = rows.filter(x => x.source === 'F1-07' && x.note && x.note.includes('فعل امر پرکاربرد'));
          if (window.TERM1_AMR_COUNT !== 18 || window.TERM1_AMR_ADDED_COUNT + window.TERM1_AMR_EXISTING_COUNT !== 18) throw new Error('Expected 18 unique Term 01 common imperative verbs.');
          for (const row of amr) {
            if (!row.ms || !row.amr || !row.m || !row.a || row.m.length !== 3 || row.a.length !== 3) throw new Error('Incomplete imperative/masdar record: ' + row.fa);
            if (row.ms === row.amr) throw new Error('Masdar and imperative collide: ' + row.fa);
          }
          if (window.TERM1_CORE_SEMANTICS_COUNT !== 33) throw new Error('Expected 32 Term 01 core trilingual meanings.');
          for (const fa of window.TERM1_CORE_SEMANTICS_KEYS) {
            const meaning = window.PERSIAN_SEMANTICS[fa];
            if (!meaning || !meaning.faMeaning || !meaning.enMeaning || !meaning.arMeaning) throw new Error('Missing trilingual meaning for ' + fa);
          }
          console.log('Validated ' + rows.length + ' Term 01 entries, including ' + window.TERM1_AMR_COUNT + ' common imperatives and ' + window.TERM1_CORE_SEMANTICS_COUNT + ' completed trilingual meanings.');
          NODE

      - name: Validate Term 02 curriculum JavaScript
        run: |
          node --check website/term02-data.js
          node --check website/term02-lexicon-additions.js
          node --check website/term02-khulasa.js
          node --check website/term02-writing.js
          node --check website/term02-proverbs.js
          node --check website/term02-core-semantics.js
          node --check website/term02-additional-semantics-01.js
          node --check website/term02-additional-semantics-02.js
          node --check website/term02-additional-semantics-03.js
          node --check website/term02-additional-semantics-04.js
          node --check website/term02-additional-semantics-05.js
          node --check website/term02-additional-semantics-06.js
          node --check website/term02-additional-semantics-07.js
          node --check website/term02-additional-semantics-08.js
          node --check website/term02-additional-semantics-09.js
          node <<'NODE'
          global.window = {};
          require('./website/term02-data.js');
          require('./website/term02-lexicon-additions.js');
          require('./website/semantic-meanings.js');
          require('./website/term02-proverbs.js');
          require('./website/term02-core-semantics.js');
          require('./website/term02-additional-semantics-01.js');
          require('./website/term02-additional-semantics-02.js');
          require('./website/term02-additional-semantics-03.js');
          require('./website/term02-additional-semantics-04.js');
          require('./website/term02-additional-semantics-05.js');
          require('./website/term02-additional-semantics-06.js');
          require('./website/term02-additional-semantics-07.js');
          require('./website/term02-additional-semantics-08.js');
          require('./website/term02-additional-semantics-09.js');
          const proverbs = window.TERM2_DATA.filter(x => x.source === 'FA2-20' && x.pos.includes('ضرب‌المثل'));
          if (proverbs.length !== 13) throw new Error('Expected 13 FA2-20 proverbs, found ' + proverbs.length);
          for (const row of proverbs) {
            const sem = window.PERSIAN_SEMANTICS[row.fa];
            if (!row.ex || row.ex.length !== 3 || !sem || !sem.faMeaning || !sem.enMeaning || !sem.arMeaning) throw new Error('Incomplete trilingual proverb: ' + row.fa);
          }
          if (window.TERM2_CORE_SEMANTICS_COUNT !== 68) throw new Error('Expected 68 missing Term 02 core meanings to be completed.');
          for (const fa of window.TERM2_CORE_SEMANTICS_KEYS) {
            const meaning = window.PERSIAN_SEMANTICS[fa];
            if (!meaning || !meaning.faMeaning || !meaning.enMeaning || !meaning.arMeaning) throw new Error('Missing Term 02 trilingual meaning for ' + fa);
          }
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH1.length !== 29) throw new Error('Expected 29 Term 02 additional meanings in batch 1.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH2.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 2.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH3.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 3.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH4.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 4.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH5.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 5.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH6.length !== 31) throw new Error('Expected 31 Term 02 additional meanings in batch 6.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH7.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 7.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH8.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 8.');
          if (window.TERM2_ADDITIONAL_SEMANTICS_BATCH9.length !== 30) throw new Error('Expected 30 Term 02 additional meanings in batch 9.');
          console.log('Validated ' + proverbs.length + ' FA2-20 proverbs, ' + window.TERM2_CORE_SEMANTICS_COUNT + ' Term 02 core meanings and ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH1.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH2.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH3.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH4.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH5.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH6.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH7.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH8.length + ' + ' + window.TERM2_ADDITIONAL_SEMANTICS_BATCH9.length + ' additional meanings.');
          NODE
          node tools/audit-term02.cjs

      - name: Validate Term 03 curriculum JavaScript
        run: |
          node --check website/term03-data.js
          node --check website/term03-writing.js
          node --check website/term03-khulasa.js
          node --check website/term03-lexicon-additions.js
          node --check website/term03-source-audit.js
          node --check website/verb-treasury.js
          node --check website/semantic-meanings.js
          node --check website/term-portal.js
          node --check website/term03-matn-verbs.js
          node --check website/term03-core-semantics.js
          node --check website/term03-additional-semantics-01.js
          node --check website/term03-additional-semantics-02.js
          node --check website/term03-additional-semantics-03.js
          node --check website/term03-additional-semantics-04.js
          node --check website/term03-additional-semantics-05.js
          node --check website/term03-additional-semantics-06.js
          node --check website/term03-additional-semantics-07.js
          node --check website/term03-additional-semantics-08.js
          node --check website/term03-additional-semantics-09.js
          node --check website/term03-additional-semantics-10.js
          node --check website/term03-additional-semantics-11.js
          node --check website/term03-additional-semantics-12.js
          node --check website/term03-additional-semantics-13.js
          node --check website/term03-additional-semantics-14.js
          node --check website/term03-additional-semantics-15.js
          node --check website/term03-additional-semantics-16.js
          node --check website/term03-additional-semantics-17.js
          node --check website/term03-additional-semantics-18.js
          node --check website/term03-additional-semantics-19.js
          node --check website/term03-additional-semantics-20.js
          node --check website/term03-additional-semantics-21.js
          node --check website/term03-additional-semantics-22.js
          node --check website/term03-additional-semantics-23.js
          node --check website/term03-additional-semantics-24.js
          node --check website/term03-additional-semantics-25.js
          node --check website/term03-additional-semantics-26.js
          node --check website/term03-additional-semantics-27.js
          node --check website/term03-additional-semantics-28.js
          node --check website/term03-additional-semantics-29.js
          node --check website/term03-additional-semantics-30.js
          node --check website/term03-additional-semantics-31.js
          node --check website/term03-additional-semantics-32.js
          node --check website/term03-additional-semantics-33.js
          node --check website/term03-additional-semantics-34.js
          node --check website/term03-additional-semantics-35.js
          node --check website/term03-additional-semantics-36.js
          node --check website/term03-additional-semantics-37.js
          node --check website/term03-additional-semantics-38.js
          node --check website/term03-additional-semantics-39.js
          node tools/audit-term03.cjs
          node --check tools/audit-trilingual-meanings.cjs
          node tools/audit-trilingual-meanings.cjs

      - name: Validate embedded application JavaScript
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('website/index.html','utf8'); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!match) throw new Error('Inline application script not found'); fs.writeFileSync('/tmp/persian-trainer.js',match[1]);"
          node --check /tmp/persian-trainer.js

  deploy:
    name: Publish GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
